name: Dependency Submission

# Sends the resolved Gradle dependencies to GitHub, so Dependabot alerts and dependency review cover them.
# Only the runtime classpath is sent: it is what ships inside the plugin. Build tooling and the
# IntelliJ Platform (provided by the IDE at runtime) are left out.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # Caching stays off: since v6 it relies on a separately licensed component.
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
          dependency-graph-include-configurations: ^runtimeClasspath$

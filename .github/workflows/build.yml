name: Build

# Builds, tests and verifies the plugin on every push and PR, keeping the ZIP as a workflow artifact.
# On main, when the version in build.gradle.kts has no tag yet, it also publishes the release
# v<version> with the ZIP attached, plus a copy named java-structure-bar.zip for a permanent
# download link (releases/latest/download/java-structure-bar.zip).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          [ -n "$VERSION" ] || { echo "::error::version not found in build.gradle.kts"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: ./gradlew --no-daemon test buildPlugin verifyPlugin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/distributions/java-structure-bar-${{ steps.version.outputs.version }}.zip
          archive: false
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check for an existing release
        id: check
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::notice::Version $VERSION is already released: bump the version in build.gradle.kts to publish a new one."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.new == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-structure-bar-${{ env.VERSION }}.zip
          # The plugin ZIP was uploaded as-is: keep it, don't extract it.
          skip-decompress: true

      - name: Publish the release
        if: steps.check.outputs.new == 'true'
        run: |
          cp "java-structure-bar-$VERSION.zip" java-structure-bar.zip
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            "java-structure-bar-$VERSION.zip" java-structure-bar.zip
